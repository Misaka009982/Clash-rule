name: Build Rules

on:
  schedule:
    - cron: "58 * * * *"

  workflow_dispatch:

permissions:
  contents: write


jobs:

  build:

    runs-on: ubuntu-latest

    steps:

      # ======================================================
      # Checkout
      # ======================================================

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true


      # ======================================================
      # Python
      # ======================================================

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"


      # ======================================================
      # Python dependencies
      # ======================================================

      - name: Install Python dependencies
        run: |
          set -e

          python -m pip install --upgrade pip

          pip install \
            requests \
            pyyaml


      # ======================================================
      # Generate .list
      # ======================================================

      - name: Generate rules
        run: |
          set -e

          echo "========================================"
          echo "Generate rules"
          echo "========================================"

          python .github/scripts/rules.py


      # ======================================================
      # Install Mihomo
      # ======================================================

      - name: Install Mihomo
        run: |
          set -e

          echo "========================================"
          echo "Install Mihomo"
          echo "========================================"

          API_URL="https://api.github.com/repos/MetaCubeX/mihomo/releases/latest"

          ASSET_URL=$(
            curl -fsSL "$API_URL" |
            jq -r '
              .assets[]
              | select(
                  .name
                  | test(
                      "^mihomo-linux-amd64-compatible-.*\\.gz$"
                    )
                )
              | .browser_download_url
            ' |
            head -n 1
          )

          if [ -z "$ASSET_URL" ] || [ "$ASSET_URL" = "null" ]; then
            echo "ERROR: Mihomo asset not found"
            exit 1
          fi

          echo "Mihomo:"
          echo "$ASSET_URL"

          rm -f \
            /tmp/mihomo \
            /tmp/mihomo.gz

          curl \
            -fL \
            --retry 3 \
            --retry-delay 2 \
            "$ASSET_URL" \
            -o /tmp/mihomo.gz

          gunzip -f /tmp/mihomo.gz

          install \
            -m 0755 \
            /tmp/mihomo \
            /usr/local/bin/mihomo

          echo
          echo "===== Mihomo version ====="

          # 这里只检查版本
          # 不执行 mihomo version
          # 不执行 mihomo
          mihomo -v


      # ======================================================
      # Verify Mihomo convert-ruleset
      # ======================================================

      - name: Verify Mihomo
        run: |
          set -e

          echo "========================================"
          echo "Verify Mihomo"
          echo "========================================"

          rm -f \
            /tmp/test-mihomo.txt \
            /tmp/test-mihomo.mrs

          printf '%s\n' \
            "example.com" \
            > /tmp/test-mihomo.txt

          mihomo \
            convert-ruleset \
            domain \
            text \
            /tmp/test-mihomo.txt \
            /tmp/test-mihomo.mrs

          test -s /tmp/test-mihomo.mrs

          echo
          echo "Mihomo convert-ruleset OK"

          ls -lh \
            /tmp/test-mihomo.mrs


      # ======================================================
      # 再次清洗 IP-CIDR
      #
      # 防止历史 .list 中还存在：
      #
      #   2001:678\:b28::118
      #
      # 或：
      #
      #   2001:db8::1
      #
      # 变成：
      #
      #   2001:678:b28::118/128
      #   2001:db8::1/128
      #
      # 这里不直接依赖 sed，而是复用 rules.py。
      # ======================================================

      - name: Normalize existing IP rules
        run: |
          set -e

          python - <<'PY'
          import ipaddress
          from pathlib import Path

          base = Path("Rule")

          def normalize(value):
              value = value.strip()
              value = value.replace("\\:", ":")

              if not value:
                  return None

              try:
                  if "/" in value:
                      return str(
                          ipaddress.ip_network(
                              value,
                              strict=False
                          )
                      )

                  ip = ipaddress.ip_address(value)

                  if ip.version == 4:
                      return f"{ip}/32"

                  return f"{ip}/128"

              except ValueError:
                  print(
                      f"[INVALID] {value}"
                  )
                  return None

          for path in base.rglob("*-ipcidr.list"):

              lines = []

              for line in path.read_text(
                  encoding="utf-8",
                  errors="ignore"
              ).splitlines():

                  line = line.strip()

                  if not line:
                      continue

                  normalized = normalize(
                      line
                  )

                  if normalized:
                      lines.append(
                          normalized
                      )

              lines = sorted(
                  set(lines)
              )

              if lines:
                  path.write_text(
                      "\n".join(lines) + "\n",
                      encoding="utf-8"
                  )

                  print(
                      f"[NORMALIZED] "
                      f"{path}: "
                      f"{len(lines)}"
                  )

              else:
                  print(
                      f"[EMPTY] {path}"
                  )
                  path.unlink(
                      missing_ok=True
                  )

          for path in base.rglob("ipcidr.list"):

              lines = []

              for line in path.read_text(
                  encoding="utf-8",
                  errors="ignore"
              ).splitlines():

                  line = line.strip()

                  if not line:
                      continue

                  normalized = normalize(
                      line
                  )

                  if normalized:
                      lines.append(
                          normalized
                      )

              lines = sorted(
                  set(lines)
              )

              if lines:
                  path.write_text(
                      "\n".join(lines) + "\n",
                      encoding="utf-8"
                  )

                  print(
                      f"[NORMALIZED] "
                      f"{path}: "
                      f"{len(lines)}"
                  )

              else:
                  path.unlink(
                      missing_ok=True
                  )
          PY


      # ======================================================
      # Convert .list -> .mrs
      # ======================================================

      - name: Convert rules to MRS
        run: |
          set -e

          echo "========================================"
          echo "Convert rules to MRS"
          echo "========================================"

          convert() {

            local type="$1"
            local src="$2"
            local dst="$3"

            # ----------------------------------------------
            # 文件不存在
            # ----------------------------------------------

            if [ ! -f "$src" ]; then

              echo "[MISSING] $src"

              rm -f "$dst"

              return 0

            fi

            # ----------------------------------------------
            # 空文件
            # ----------------------------------------------

            if ! grep -q '[^[:space:]]' "$src"; then

              echo "[EMPTY] $src"

              rm -f "$dst"

              return 0

            fi

            # ----------------------------------------------
            # 转换
            # ----------------------------------------------

            echo
            echo "[MRS]"
            echo "  Type: $type"
            echo "  Src : $src"
            echo "  Dst : $dst"

            # 注意：
            # 不要执行 mihomo 本身。
            # 只执行 convert-ruleset。

            if ! mihomo \
              convert-ruleset \
              "$type" \
              text \
              "$src" \
              "$dst"
            then

              echo
              echo "ERROR: Mihomo conversion failed"
              echo "Source: $src"

              rm -f "$dst"

              exit 1

            fi

            # ----------------------------------------------
            # 检查输出
            # ----------------------------------------------

            if [ ! -s "$dst" ]; then

              echo
              echo "ERROR: Empty MRS output:"
              echo "$dst"

              rm -f "$dst"

              exit 1

            fi

            echo "[OK] $dst"

          }


          # ==================================================
          # Rule/<name>
          # ==================================================

          for d in Rule/*; do

            [ -d "$d" ] || continue

            if [ "$(basename "$d")" = "Other" ]; then
              continue
            fi

            convert \
              domain \
              "$d/domains.list" \
              "$d/domains.mrs"

            convert \
              ipcidr \
              "$d/ipcidr.list" \
              "$d/ipcidr.mrs"

          done


          # ==================================================
          # Rule/Other
          # ==================================================

          if [ -d "Rule/Other" ]; then

            for f in Rule/Other/*-domains.list; do

              [ -f "$f" ] || continue

              convert \
                domain \
                "$f" \
                "${f%.list}.mrs"

            done


            for f in Rule/Other/*-ipcidr.list; do

              [ -f "$f" ] || continue

              convert \
                ipcidr \
                "$f" \
                "${f%.list}.mrs"

            done

          fi


      # ======================================================
      # Install sing-box
      # ======================================================

      - name: Install sing-box
        run: |
          set -e

          echo "========================================"
          echo "Install sing-box"
          echo "========================================"

          API_URL="https://api.github.com/repos/SagerNet/sing-box/releases"

          VERSION=$(
            curl -fsSL "$API_URL" |
            jq -r '
              .[]
              | select(.prerelease == false)
              | .tag_name
            ' |
            head -n 1
          )

          if [ -z "$VERSION" ] || [ "$VERSION" = "null" ]; then
            echo "ERROR: Unable to determine sing-box version"
            exit 1
          fi

          VERSION_NO_V="${VERSION#v}"

          echo "sing-box version: $VERSION"

          ARCHIVE="sing-box-${VERSION_NO_V}-linux-amd64.tar.gz"

          DOWNLOAD_URL="https://github.com/SagerNet/sing-box/releases/download/${VERSION}/${ARCHIVE}"

          echo "Download:"
          echo "$DOWNLOAD_URL"

          rm -rf \
            /tmp/sing-box

          mkdir -p \
            /tmp/sing-box

          curl \
            -fL \
            --retry 3 \
            --retry-delay 2 \
            "$DOWNLOAD_URL" \
            -o /tmp/sing-box.tar.gz

          tar \
            -xzf \
            /tmp/sing-box.tar.gz \
            -C /tmp/sing-box \
            --strip-components=1

          test -f \
            /tmp/sing-box/sing-box

          install \
            -m 0755 \
            /tmp/sing-box/sing-box \
            /usr/local/bin/sing-box

          echo
          echo "===== sing-box version ====="

          sing-box version


      # ======================================================
      # Verify sing-box
      # ======================================================

      - name: Verify sing-box
        run: |
          set -e

          echo "========================================"
          echo "Verify sing-box"
          echo "========================================"

          cat > /tmp/test-srs.json <<'JSON'
          {
            "version": 2,
            "rules": [
              {
                "domain": [
                  "example.com"
                ],
                "domain_suffix": [
                  "google.com"
                ],
                "ip_cidr": [
                  "1.2.3.4/32",
                  "2001:db8::1/128"
                ]
              }
            ]
          }
          JSON

          rm -f \
            /tmp/test.srs

          sing-box \
            rule-set \
            compile \
            --output \
            /tmp/test.srs \
            /tmp/test-srs.json

          test -s \
            /tmp/test.srs

          echo
          echo "sing-box rule-set compile OK"

          ls -lh \
            /tmp/test.srs


      # ======================================================
      # Generate SRS
      # ======================================================

      - name: Convert rules to SRS
        run: |
          set -e

          echo "========================================"
          echo "Convert rules to SRS"
          echo "========================================"

          python \
            .github/scripts/srs.py


      # ======================================================
      # Remove orphan MRS
      #
      # 如果 list 已经不存在，
      # 对应 mrs 也删除。
      # ======================================================

      - name: Cleanup orphan MRS
        run: |
          set -e

          echo "========================================"
          echo "Cleanup orphan MRS"
          echo "========================================"

          find Rule \
            -type f \
            -name "*.mrs" \
            -print0 |
          while IFS= read -r -d '' mrs; do

            list="${mrs%.mrs}.list"

            if [ ! -f "$list" ]; then

              echo "[DELETE] $mrs"

              rm -f "$mrs"

            fi

          done


      # ======================================================
      # Show generated files
      # ======================================================

      - name: Show generated files
        run: |
          set -e

          echo "========================================"
          echo "Generated files"
          echo "========================================"

          echo
          echo "===== LIST ====="

          find Rule \
            -type f \
            -name "*.list" \
            -print |
          sort


          echo
          echo "===== MRS ====="

          find Rule \
            -type f \
            -name "*.mrs" \
            -print |
          sort


          echo
          echo "===== SRS ====="

          find Rule \
            -type f \
            -name "*.srs" \
            -print |
          sort


          echo
          echo "===== COUNT ====="

          echo -n "LIST: "
          find Rule \
            -type f \
            -name "*.list" |
          wc -l

          echo -n "MRS : "
          find Rule \
            -type f \
            -name "*.mrs" |
          wc -l

          echo -n "SRS : "
          find Rule \
            -type f \
            -name "*.srs" |
          wc -l


      # ======================================================
      # Git status
      # ======================================================

      - name: Git status
        run: |
          echo "========================================"
          echo "Git status"
          echo "========================================"

          git status --short


      # ======================================================
      # Commit & Push
      # ======================================================

      - name: Commit & Push
        run: |
          set -e

          echo "========================================"
          echo "Commit & Push"
          echo "========================================"

          git config \
            user.name \
            "github-actions[bot]"

          git config \
            user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          # -A 非常重要：
          # 可以把删除的 .list/.mrs/.srs 一起提交。

          git add -A Rule

          if git diff --cached --quiet; then

            echo "No changes."

            exit 0

          fi

          echo
          echo "===== Changes ====="

          git diff \
            --cached \
            --stat

          git commit \
            -m "Update rules"

          git push
